name: docker

# Builds the image, starts it and loads the dashboard page (which opens the
# dataset), and only publishes it to ghcr.io/<owner>/<repo> if that works:
#   push to main      -> :latest
#   push tag vX.Y.Z   -> :X.Y.Z
#   pull request      -> build and test only
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dashboard:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          trap 'for c in defaults port-only; do docker logs "$c" 2>&1 | tail -40; done' EXIT
          # check NAME PORT [ARGS...]: start the image and load the dashboard page,
          # which runs the dashboard and opens its dataset.
          check() {
            name=$1 port=$2
            shift 2
            docker run -d --name "$name" -p "$port:$port" dashboard:test "$@"
            for i in $(seq 1 60); do
              curl -fs -o /dev/null "http://127.0.0.1:$port/" && break
              sleep 2
            done
            curl -fsSL -o /dev/null --max-time 180 "http://127.0.0.1:$port/"
            sleep 5
            if docker logs "$name" 2>&1 | grep -qE "Traceback|Error running application handler"; then
              echo "::error::$name: the dashboard logged an error"
              exit 1
            fi
          }
          # No arguments: address, port and dataset all come from the image.
          default_port=$(docker image inspect dashboard:test --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^PORT=//p')
          check defaults "$default_port"
          # Only a port: the address and dataset still come from the image.
          check port-only 5006 --port 5006

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # No provenance/SBOM: publish a plain linux/amd64 manifest, which ARM
      # hosts (Apple Silicon) can pull and run under emulation.
      - name: Publish
        if: github.event_name != 'pull_request' && steps.meta.outputs.tags != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
