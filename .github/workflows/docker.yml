name: docker

# Builds the image, starts it the way the README does and loads the dashboard
# page (which opens the default dataset), and only publishes it to
# ghcr.io/<owner>/<repo> if that works:
#   push to main      -> :latest
#   push tag vX.Y.Z   -> :X.Y.Z
#   pull request      -> build and test only
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dashboard:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          # Address and port as arguments, then the image's default dataset (its CMD).
          mapfile -t dataset_args < <(docker image inspect dashboard:test --format '{{json .Config.Cmd}}' | jq -r '.[]')
          docker run -d --name dashboard -p 5006:5006 dashboard:test \
            --address 0.0.0.0 --port 5006 "${dataset_args[@]}"
          trap 'docker logs dashboard' EXIT
          for i in $(seq 1 60); do
            curl -fs -o /dev/null http://127.0.0.1:5006/ && break
            sleep 2
          done
          # Loading the page runs the dashboard and opens its dataset.
          curl -fsSL -o /dev/null --max-time 180 http://127.0.0.1:5006/
          sleep 5
          if docker logs dashboard 2>&1 | grep -qE "Traceback|Error running application handler"; then
            echo "::error::The dashboard logged an error"
            exit 1
          fi

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # No provenance/SBOM: publish a plain linux/amd64 manifest, which ARM
      # hosts (Apple Silicon) can pull and run under emulation.
      - name: Publish
        if: github.event_name != 'pull_request' && steps.meta.outputs.tags != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
