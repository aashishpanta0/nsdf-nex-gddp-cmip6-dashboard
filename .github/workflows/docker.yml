name: docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Matches NEX_GDDP_CMIP6_IMAGE in docker-compose.yml / .env.example.
          images: ghcr.io/${{ github.repository_owner }}/nsdf-nex-gddp-cmip6-dashboard
          # Publish only :latest (from main); PR builds are not pushed.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}

      # The Dockerfile imports OpenVisus/openvisuspy at build time, so a
      # successful build doubles as a smoke test.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
